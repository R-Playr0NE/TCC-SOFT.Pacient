spring.application.name=soft

# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/soft_db
spring.datasource.username=postgres
spring.datasource.password=postdba

# Atualize as tabelas do banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

# Exibir no terminal as consultas SQL geradas
spring.jpa.show-sql=true

# Limpar o cache para a execução do Thymeleaf
spring.thymeleaf.cache=false

# Configuração do servidor
server.port=8080